name: mujez-staging
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mujez_owner
      POSTGRES_DB: mujez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mujez_owner -d mujez']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  api:
    image: ${API_IMAGE:-mujez-staging-api:current}
    build:
      context: ../..
    restart: unless-stopped
    environment:
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
    env_file:
      - path: ./api.env
        format: raw
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
  maintenance:
    image: ${API_IMAGE:-mujez-staging-api:current}
    profiles: [maintenance]
    env_file:
      - path: ./api.env
        format: raw
      - path: ./admin.env
        format: raw
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../database:/app/database:ro
      - ./provision-roles.mjs:/app/provision-roles.mjs:ro
    logging: *logging
volumes:
  postgres_data:
  redis_data:
